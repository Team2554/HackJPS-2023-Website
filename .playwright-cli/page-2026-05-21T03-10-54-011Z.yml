        - heading "ABOUT HACKJPS" [level=2] [ref=e52]
        - paragraph [ref=e53]:
          - text: HackJPS is our annual flagship hackathon, bringing together the most creative minds for a weekend of intense learning and building. Whether you're a seasoned developer or just starting out, we provide the environment and resources you need to turn your ideas into reality.
          - text: Participation will be open to middle and high school students (aged 13+) from Edison as well as from other locations or school districts. Participants may have any level of experience, or none at all. We are welcoming to beginners and experts alike!
          - text: Additionally, participants will be able to attend virtual workshops hosted by sponsors or student organizations, exposing them to a multitude of other topics that might interest them.
